name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  inference-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn torch pydantic pytest httpx prometheus-client

      - name: Run inference API tests
        run: |
          pytest tests/inference/test_api.py