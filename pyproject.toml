[project]
name = "lumina-rec"
version = "0.1.0"
description = "Local MLOps recommendation system with MLflow, FastAPI, and Feast."
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "torch",
    "pydantic",
    "mlflow",
    "boto3",
    "pytest",
    "httpx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]