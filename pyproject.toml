[project]
name = "lumina-rec"
version = "0.1.0"
description = "Local MLOps recommendation system with MLflow, FastAPI, Feast, and PyTorch."
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "torch",
    "pydantic",
    "mlflow",
    "boto3",
    "pytest",
    "httpx",
    "python-dotenv",
    "prometheus-client",
    "slowapi",
    "locust",
    "pandas",
    "scikit-learn"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
