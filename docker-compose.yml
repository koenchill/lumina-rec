version: '3.9'
services:
  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - mlflow
    environment:
      MODEL_PATH: /app/ml/models/demo_model.pt
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    command: start-dev

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://postgres:postgres@postgres:5432/lumina --default-artifact-root s3://mlflow-artifacts
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c", "pip install psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://postgres:postgres@postgres:5432/lumina --default-artifact-root s3://mlflow-artifacts"]
